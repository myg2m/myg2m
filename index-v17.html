const $ = i => document.getElementById(i);
const set = (id, h) => { const e = $(id); if (e) e.innerHTML = h; return !!e; };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today = () => new Date().toLocaleDateString('en-CA');
const norm = s => String(s || '').toLowerCase().replace(/[^a-z]/g, '');
const num = v => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
const r1 = v => Math.round(num(v) * 10) / 10;

const S = { u: null, ex: [], cl: [], foods: [], foodDate: today(), foodMeal: 'Breakfast', foodLogs: [], cart: [], cid: '', date: today(), tab: 'clients', cTab: 'workouts', loaded: 0 };

/* ---------- Exercise helpers ---------- */
const CARDIO = ['Elliptical', 'Spin bike', 'Treadmill', 'Seated bike', 'Assault bike', 'RowErg', 'SkiErg', 'Stair Master', 'Running'];
const CKEYS = CARDIO.map(norm).concat(['assaultedbike', 'rower', 'stairmaster', 'stairmill', 'stepmill']);
const isCardio = n => CKEYS.includes(norm(n));
function cleanEx() {
  const old = {}; S.ex.forEach(e => { if (e.media && isCardio(e.name)) old[norm(e.name)] = e.media; });
  S.ex = S.ex.filter(e => norm(e.group) != 'cardio' && !isCardio(e.name)).concat(CARDIO.map(name => ({ name, group: 'Cardio', media: old[norm(name)] || '' })));
}
const ytSearch = n => 'https://www.youtube.com/results?search_query=' + encodeURIComponent(n + ' exercise how to');
const okUrl = u => /^https?:\/\//i.test(String(u || '').trim());
const isImg = u => /\.(png|jpe?g|gif|webp)(\?|#|$)/i.test(u);
const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform == 'MacIntel' && navigator.maxTouchPoints > 1);
const driveId = u => { const m = String(u).match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:[^#]*&)?id=)([\w-]{10,})/i); return m ? m[1] : ''; };
const isVid = u => /\.(mp4|webm|mov)(\?|#|$)/i.test(u);

const MEDIA = {};
const ytId = u => { const m = String(u).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:[^#]*&)?v=|shorts\/|embed\/|live\/))([\w-]{11})/i); return m ? m[1] : ''; };
function splitMedia(raw) { const m = String(raw || '').trim().match(/^(.*?)(?:#(photo|video))?$/i); return { url: m[1], type: (m[2] || 'auto').toLowerCase() }; }
function composeMedia(url, type) { url = String(url || '').trim(); return url ? (type && type != 'auto' ? url + '#' + type : url) : ''; }
function parseMedia(raw) {
  const s = splitMedia(raw), url = s.url, hint = s.type == 'auto' ? '' : s.type;
  if (!okUrl(url)) return null;
  const y = ytId(url), d = driveId(url);
  if (y) return { url, kind: 'yt', id: y, type: 'video' };
  if (d) return { url, kind: 'drive', id: d, type: hint || 'video' };
  if (isImg(url)) return { url, kind: 'file', type: 'photo' };
  if (isVid(url)) return { url, kind: 'file', type: 'video' };
  if (hint) return { url, kind: 'file', type: hint };
  return { url, kind: 'link', type: 'link' };
}
function mediaBlock(raw, dom, name) {
  const m = parseMedia(raw); if (!m) return '';
  MEDIA[dom] = m;
  const alt = esc(name || '');
  if (m.kind == 'link') return `<div class="gap"><a href="${esc(m.url)}" target="_blank" rel="noopener">▶ Open how-to link</a></div>`;
  if (m.type == 'photo') {
    const src = m.kind == 'drive' ? `https://lh3.googleusercontent.com/d/${m.id}` : m.url;
    return `<div class="mbox"><img class="mimg" loading="lazy" src="${esc(src)}" alt="${alt}" onerror="this.outerHTML='<div class=&quot;mfail&quot;>This photo can’t be loaded. If it is on Google Drive, set sharing to “Anyone with the link”.</div>'"></div>`;
  }
  if (m.kind == 'file') return `<div class="mbox"><video class="mvid" controls playsinline preload="metadata" src="${esc(m.url)}#t=0.1"></video></div>`;
  const poster = m.kind == 'yt' ? `https://i.ytimg.com/vi/${m.id}/hqdefault.jpg` : `https://drive.google.com/thumbnail?id=${m.id}&sz=w800`;
  return `<div class="mbox"><div class="vbox" id="v_${dom}"><img src="${poster}" alt="${alt}" loading="lazy" onerror="this.style.display='none'"><button class="play" onclick="playMedia('${dom}')" aria-label="Play video"><span>▶</span></button></div></div>`
    + (m.kind == 'drive' ? `<div class="mu" style="margin:-4px 0 8px"><a href="https://drive.google.com/file/d/${m.id}/view" target="_blank" rel="noopener">Video not playing? Open in Google Drive</a></div>` : '');
}
function playMedia(dom) {
  const m = MEDIA[dom], box = $('v_' + dom); if (!m || !box) return;
  const frame = src => `<iframe src="${src}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
  if (m.kind == 'yt') box.innerHTML = frame(`https://www.youtube-nocookie.com/embed/${m.id}?autoplay=1&playsinline=1&rel=0&modestbranding=1`);
  else if (isIOS()) box.innerHTML = `<video controls playsinline autoplay src="https://drive.usercontent.google.com/download?id=${m.id}&export=download&confirm=t" onerror="driveFrame('${dom}')"></video>`;
  else driveFrame(dom);
}
function driveFrame(dom) { const m = MEDIA[dom], box = $('v_' + dom); if (m && box) box.innerHTML = `<iframe src="https://drive.google.com/file/d/${m.id}/preview" allow="autoplay; fullscreen" allowfullscreen></iframe>`; }

const FD = { sets: 'Sets', reps: 'Reps', weight: 'Weight', duration: 'Duration', distance: 'Distance' };
const UN = { duration: ['min', 'sec', 'hr'], distance: ['km', 'm', 'mi'] };
const UDEF = { duration: 'min', distance: 'km' };
const ALIAS = {
  duration: { sec: ['s', 'sec', 'secs', 'second', 'seconds'], min: ['m', 'min', 'mins', 'minute', 'minutes'], hr: ['h', 'hr', 'hrs', 'hour', 'hours'] },
  distance: { km: ['km', 'kms', 'kilometer', 'kilometers', 'kilometre', 'kilometres'], m: ['m', 'meter', 'meters', 'metre', 'metres'], mi: ['mi', 'mile', 'miles'] }
};
function parseUV(k, v) {
  const m = String(v ?? '').trim().match(/^([\d.,]+)\s*([a-zA-Z]*)$/);
  if (!m) return { n: '', u: UDEF[k], raw: String(v ?? '').trim() };
  const w = m[2].toLowerCase(); let u = UDEF[k];
  if (w) { const hit = Object.keys(ALIAS[k]).find(x => ALIAS[k][x].includes(w)); if (hit) u = hit; }
  return { n: m[1].replace(',', '.'), u };
}
const uv = (k, v) => { const p = parseUV(k, v); return p.n === '' ? p.raw : `${p.n} ${p.u}`; };
const unitSel = (k, attr, sel) => `<select ${attr} >${UN[k].map(x => `<option ${x == sel ? 'selected' : ''}>${x}</option>`).join('')}</select>`;
const ORDER = ['sets', 'reps', 'weight', 'duration', 'distance'];
const fieldsOf = i => {
  const f = String(i.fields || '').split(',').filter(x => FD[x]);
  return f.length ? f : (isCardio(i.exercise) ? ['duration'] : ['sets', 'reps', 'weight']);
};
const val = (o, k, i) => { let v = o ? o[k] : ''; if (!v && k == 'duration' && !i.fields && isCardio(i.exercise)) v = o ? o.reps : ''; return v || ''; };
function fmt(o, i) {
  const f = fieldsOf(i), g = k => String(val(o, k, i)).trim(), p = [];
  const s = f.includes('sets') ? g('sets') : '', r = f.includes('reps') ? g('reps') : '';
  if (s && r) p.push(`${s} × ${r}`); else if (s) p.push(`${s} sets`); else if (r) p.push(`${r} reps`);
  if (f.includes('weight') && g('weight')) p.push('@ ' + g('weight'));
  if (f.includes('duration') && g('duration')) p.push(uv('duration', g('duration')));
  if (f.includes('distance') && g('distance')) p.push(uv('distance', g('distance')));
  return esc(p.join(' · '));
}

/* ---------- Supabase Data Adapter ---------- */
function checkErr(res, fallback) {
  if (res && res.error) throw new Error(res.error.message || fallback || 'Database error');
  return res.data;
}

async function api(action, d = {}) {
  switch (action) {
    case 'login': {
      const raw = String(d.username || '').trim().toLowerCase();
      const email = raw.includes('@') ? raw : `${raw}@coachtracker.local`;
      const { data, error } = await sb.auth.signInWithPassword({ email, password: d.password });
      if (error) throw new Error(/invalid login|invalid credentials/i.test(error.message || '') ? 'Wrong username or password' : (error.message || 'Could not log in'));
      const prof = checkErr(await sb.from('profiles').select('*').eq('id', data.user.id).single(), 'Profile missing');
      return { user: prof };
    }
    case 'clients': {
      let q = sb.from('profiles').select('id, name, username').eq('role', 'client'); if (S.u && S.u.role === 'coach') q = q.eq('created_by', S.u.id);
      const cl = checkErr(await q.order('name'));
      return { cl };
    }
    case 'coaches': {
      const coaches = checkErr(await sb.from('profiles').select('id, name, username').eq('role', 'coach').order('name'));
      return { coaches };
    }
    case 'allUsers': {
      const users = checkErr(await sb.from('profiles').select('id, name, username, role').order('name'));
      return { users };
    }
    case 'setRole': {
      if (S.u.role !== 'admin') throw new Error('Not allowed');
      if (!['client', 'coach', 'admin'].includes(d.role)) throw new Error('Invalid role');
      checkErr(await sb.from('profiles').update({ role: d.role }).eq('id', d.userId));
      return { ok: 1 };
    }
    case 'exercises': {
      const ex = checkErr(await sb.from('exercises').select('name, group, media').order('name'));
      return { ex };
    }
    case 'foods': {
      const foods = checkErr(await sb.from('foods').select('name, serving, protein, carbs, sugar, fat, calories').order('name'));
      return { foods };
    }
    case 'getFoodLogs': {
      const cid = (S.u.role === 'admin' || S.u.role === 'coach') ? d.clientId : S.u.id;
      const items = checkErr(await sb.from('food_logs').select('*').eq('client_id', cid).eq('date', d.date).order('created_at', { ascending: true }));
      return { items };
    }
    case 'addFoodLog': {
      const cid = (S.u.role === 'admin' || S.u.role === 'coach') ? d.clientId : S.u.id;
      const row = checkErr(await sb.from('food_logs').insert({
        client_id: cid,
        date: d.date,
        meal: d.meal || 'Meal',
        food_name: d.food_name,
        serving: d.serving || '',
        servings: num(d.servings) > 0 ? num(d.servings) : 1,
        protein: r1(d.protein),
        carbs: r1(d.carbs),
        sugar: r1(d.sugar),
        fat: r1(d.fat),
        calories: r1(d.calories),
        notes: d.notes || ''
      }).select().single());
      return { ok: 1, item: row };
    }
    case 'delFoodLog': {
      checkErr(await sb.from('food_logs').delete().eq('id', d.id));
      return { ok: 1 };
    }
    case 'addClient': {
      const nm = String(d.name || '').trim();
      const un = String(d.username || '').trim().toLowerCase();
      const pw = String(d.password || '');
      const allowedRoles = S.u.role === 'admin' ? ['client', 'coach', 'admin'] : ['client'];
      const targetRole = allowedRoles.includes(d.role) ? d.role : 'client';
      if (!nm || !un) throw new Error('Name and username are required');
      if (pw.length < 4) throw new Error('Password must be 4+ characters');
      const email = un.includes('@') ? un : `${un}@coachtracker.local`;

      const { data: authData, error: authErr } = await sbSignup.auth.signUp({
        email,
        password: pw,
        options: { data: { name: nm, username: un, role: targetRole } }
      });
      if (authErr) throw new Error(authErr.message || 'Could not create client account');
      if (!authData || !authData.user) throw new Error('Account creation returned no user');

      checkErr(await sb.from('profiles').upsert({
        id: authData.user.id,
        name: nm,
        username: un,
        role: targetRole,
        created_by: S.u.id
      }, { onConflict: 'id' }));
      return { ok: 1 };
    }
    case 'resetPw': {
      checkErr(await sb.rpc('admin_reset_password', {
        p_client_id: d.clientId,
        p_password: d.password
      }));
      return { ok: 1 };
    }
    case 'delClient': {
      checkErr(await sb.rpc('admin_delete_client', { p_client_id: d.clientId }));
      return { ok: 1 };
    }
    case 'addExercise': {
      const n = String(d.name || '').trim();
      if (n) {
        checkErr(await sb.from('exercises').upsert({ name: n, group: d.group || 'Custom' }, { onConflict: 'name', ignoreDuplicates: true }));
      }
      return { ok: 1 };
    }
    case 'setMedia': {
      const n = String(d.name || '').trim();
      checkErr(await sb.from('exercises').upsert({ name: n, group: d.group || 'Custom', media: d.media || '' }, { onConflict: 'name' }));
      return { ok: 1 };
    }
    case 'assign': {
      const rows = [];
      (d.dates || []).forEach(date => (d.items || []).forEach(it => rows.push({
        client_id: d.clientId,
        date,
        exercise: it.exercise,
        sets: it.sets || '',
        reps: it.reps || '',
        weight: it.weight || '',
        duration: it.duration || '',
        distance: it.distance || '',
        fields: it.fields || '',
        notes: it.notes || ''
      })));
      checkErr(await sb.from('assign').insert(rows));
      return { n: rows.length };
    }
    case 'editAssign': {
      checkErr(await sb.from('assign').update({ sets: d.sets, reps: d.reps, weight: d.weight }).eq('id', d.id));
      return { ok: 1 };
    }
    case 'delAssign': {
      checkErr(await sb.from('assign').delete().eq('id', d.id));
      return { ok: 1 };
    }
    case 'plan': {
      if (S.u.role === 'client' && d.date < today()) return { items: [] };
      const cid = (S.u.role === 'admin' || S.u.role === 'coach') ? d.clientId : S.u.id;
      const [aRes, eRes, mRes] = await Promise.all([
        sb.from('assign').select('*, logs(*)').eq('client_id', cid).eq('date', d.date),
        sb.from('exercises').select('name, media'),
        sb.from('client_day_meta').select('program_name').eq('client_id', cid).eq('date', d.date).maybeSingle()
      ]);
      const assigns = checkErr(aRes);
      const exList = checkErr(eRes);
      const med = {};
      exList.forEach(e => { if (e.media) med[e.name.toLowerCase()] = e.media; });
      const items = assigns.map(a => {
        const lg = Array.isArray(a.logs) ? a.logs[0] : a.logs;
        return {
          ...a,
          media: med[a.exercise.toLowerCase()] || '',
          log: lg ? { ...lg, done: String(lg.done) } : null
        };
      });
      return { items, program: (mRes && mRes.data && mRes.data.program_name) || '' };
    }
    case 'log': {
      checkErr(await sb.from('logs').upsert({
        assign_id: d.assignId,
        sets: d.sets || '',
        reps: d.reps || '',
        weight: d.weight || '',
        duration: d.duration || '',
        distance: d.distance || '',
        note: d.note || '',
        done: Boolean(d.done === true || d.done === 'true'),
        updated_at: new Date().toISOString()
      }, { onConflict: 'assign_id' }));
      return { ok: 1 };
    }
    case 'progress': {
      const t = today();
      const assigns = checkErr(await sb.from('assign').select('*, logs(*)').eq('client_id', d.clientId).lte('date', t).order('date', { ascending: false }));
      const by = {};
      assigns.forEach(a => {
        const lg = Array.isArray(a.logs) ? a.logs[0] : a.logs;
        const isDone = lg && lg.done === true;
        const x = by[a.date] = by[a.date] || { date: a.date, done: 0, total: 0, items: [] };
        x.total++;
        if (isDone) x.done++;
        x.items.push({ ...a, log: lg ? { ...lg, done: String(lg.done) } : null });
      });
      const days = Object.keys(by).sort().reverse().map(k => by[k]).slice(0, 30);
      return { days };
    }
    /* ---------- Admin-Only Session Recorder ---------- */
    case 'getSessions': {
      const items = checkErr(await sb.from('admin_sessions').select('*').eq('client_id', d.clientId).order('date', { ascending: false }).order('created_at', { ascending: true }));
      return { items };
    }
    case 'addSession': {
      const row = checkErr(await sb.from('admin_sessions').insert({
        client_id: d.clientId,
        date: d.date,
        exercise: d.exercise,
        fields: d.fields,
        sets: d.sets,
        reps: d.reps,
        weight: d.weight,
        duration: d.duration,
        distance: d.distance,
        notes: d.notes
      }).select().single());
      return { ok: 1, id: row.id };
    }
    case 'delSession': {
      checkErr(await sb.from('admin_sessions').delete().eq('id', d.id));
      return { ok: 1 };
    }
  }
  throw new Error('Unknown action: ' + action);
}

/* ---------- Live effects ---------- */
function toast(msg) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2400);
}
function updateProg() {
  const p = $('pg'); if (!p) return;
  const t = document.querySelectorAll('#pl>.card').length, d = document.querySelectorAll('#pl>.card.done').length;
  p.hidden = !t; if (!t) return;
  const was = p.classList.contains('all'), full = d == t;
  p.classList.toggle('all', full);
  $('pgt').textContent = full ? 'Workout complete' : `${d} of ${t} done`;
  $('pgs').textContent = full ? 'All exercises logged' : `${t - d} to go`;
  $('pgb').style.width = (d / t * 100) + '%';
  if (full && !was) { p.classList.remove('cheer'); void p.offsetWidth; p.classList.add('cheer'); }
}
function countUp() {
  const key = S.sc + '|' + document.querySelectorAll('.stats b').length; if (S.cuKey == key) return; S.cuKey = key;
  if (matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  document.querySelectorAll('.stats b').forEach(el => {
    const n = Number(el.textContent); if (!Number.isInteger(n) || n < 1) return;
    const t0 = performance.now();
    (function f(t) { const k = Math.min(1, (t - t0) / 700); el.textContent = Math.round(n * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(f); })(t0);
  });
}

/* ---------- Routines (additive module) ---------- */
async function rtLoad() {
  try {
    const r = checkErr(await sb.from('routines').select('id,name,routine_items(*)').order('name'));
    r.forEach(x => x.routine_items.sort((a, b) => a.position - b.position)); S.rt = r; S.rtErr = '';
  } catch (e) { S.rt = []; S.rtErr = e.message; }
  cartView();
}
function rtBar() {
  if (!S.rt) { rtLoad(); return '<div class="skel" style="height:64px"></div>'; }
  return `<div class="card"><h2>Routines</h2>` + (S.rtErr ? `<p class="err">Routines unavailable: ${esc(S.rtErr)}</p>` : '')
    + (S.rt.length ? `<div class="row"><select id="rtsel">${S.rt.map(r => `<option value="${r.id}">${esc(r.name)} (${r.routine_items.length})</option>`).join('')}</select><button class="g" onclick="rtUse()">Add to list</button><button class="d sm" onclick="rtDel()">Delete</button></div>` : '<p class="mu">No routines yet. Build a list below, then save it.</p>')
    + (S.cart.length ? `<div class="row gap"><input id="rtname" placeholder="Name this list as a routine"><button onclick="rtSave()">Save routine</button></div>` : '') + `</div>`;
}
function rtUse() {
  const r = S.rt.find(x => x.id == $('rtsel').value); if (!r) return;
  r.routine_items.forEach(i => S.cart.push({ exercise: i.exercise, fields: i.fields, sets: i.sets, reps: i.reps, weight: i.weight, duration: i.duration, distance: i.distance, notes: i.notes }));
  cartView(); toast(r.routine_items.length + ' exercises added');
}
async function rtSave() {
  const n = (($('rtname') || {}).value || '').trim(); if (!n) { alert('Name the routine first'); return; }
  const r = checkErr(await sb.from('routines').insert({ name: n }).select().single());
  checkErr(await sb.from('routine_items').insert(S.cart.map((c, i) => ({ routine_id: r.id, position: i, exercise: c.exercise, fields: c.fields || '', sets: c.sets || '', reps: c.reps || '', weight: c.weight || '', duration: c.duration || '', distance: c.distance || '', notes: c.notes || '' }))));
  S.rt = null; toast('Routine saved'); cartView();
}
async function rtDel() {
  const r = S.rt.find(x => x.id == $('rtsel').value); if (!r || !confirm('Delete routine "' + r.name + '"?')) return;
  checkErr(await sb.from('routines').delete().eq('id', r.id)); S.rt = null; cartView();
}

/* ---------- Routines tab (coach/admin) ---------- */
async function rtRefresh() {
  try {

const MEALS = ['Breakfast', 'Lunch', 'Dinner', 'Snack', 'Supplement'];
async function ensureFoods() {
  if (!S.foods.length) {
    try { S.foods = (await api('foods')).foods || []; } catch (_) { S.foods = []; }
  }
}
function scaleFood(food, mult) {
  const m = num(mult) > 0 ? num(mult) : 1;
  return {
    serving: food ? (food.serving || '') : '',
    protein: r1(num(food && food.protein) * m),
    carbs: r1(num(food && food.carbs) * m),
    sugar: r1(num(food && food.sugar) * m),
    fat: r1(num(food && food.fat) * m),
    calories: r1(num(food && food.calories) * m)
  };
}
function onFoodPick() {
  const inp = $('fd_name'); if (!inp) return;
  const q = inp.value.trim().toLowerCase();
  const hit = S.foods.find(f => f.name.toLowerCase() === q);
  if (!hit) return;
  const mult = num($('fd_serv') ? $('fd_serv').value : 1) || 1;
  const sc = scaleFood(hit, mult);
  if ($('fd_unit')) $('fd_unit').value = sc.serving;
  if ($('fd_pro')) $('fd_pro').value = sc.protein;
  if ($('fd_carb')) $('fd_carb').value = sc.carbs;
  if ($('fd_sug')) $('fd_sug').value = sc.sugar;
  if ($('fd_fat')) $('fd_fat').value = sc.fat;
  if ($('fd_cal')) $('fd_cal').value = sc.calories;
}
function onServChange() {
  const inp = $('fd_name'); if (!inp) return;
  const q = inp.value.trim().toLowerCase();
  const hit = S.foods.find(f => f.name.toLowerCase() === q);
  if (hit) onFoodPick();
}

  const payload = {

    sugar: num($('fd_sug') ? $('fd_sug').value : 0),
    fat: num($('fd_fat') ? $('fd_fat').value : 0),

function foodTotals(list) {
  return (list || []).reduce((acc, x) => {
    acc.calories += num(x.calories);
    acc.protein += num(x.protein);
    acc.carbs += num(x.carbs);
    acc.fat += num(x.fat);
    acc.sugar += num(x.sugar);
    return acc;
  }, { calories: 0, protein: 0, carbs: 0, fat: 0, sugar: 0 });
}

    rows.forEach(x => { const k = [x.food_name, x.serving, x.servings].join('|').toLowerCase(); const e = m.get(k); if (e) e.n++; else m.set(k, { x, n: 1 }); });

/* ---------- Body Fat % & Adaptive Macro/TDEE Calculator ---------- */
const Calc = {
  toKg(w, units) {
    const x = num(w);
    if (!x) return 0;
    return units === 'imperial' ? x * 0.45359237 : x;
  },
  fromKg(kg, units) {
    const x = num(kg);
    if (!x) return 0;
    return units === 'imperial' ? x / 0.45359237 : x;
  },
  toCm(v, units) {
    const x = num(v);
    if (!x) return 0;
    return units === 'imperial' ? x * 2.54 : x;
  },
  navyBF({ sex, units, height, waist, neck, hip }) {
    const h = this.toCm(height, units);
    const w = this.toCm(waist, units);
    const n = this.toCm(neck, units);
    const hp = this.toCm(hip, units);
    if (!h || !w || !n) return null;
    if (sex === 'female') {
      if (!hp || (w + hp - n) <= 0) return null;
      const bf = 495 / (1.29579 - 0.35004 * Math.log10(w + hp - n) + 0.22100 * Math.log10(h)) - 450;
      return Math.max(4, Math.min(60, Math.round(bf * 10) / 10));
    } else {
      if ((w - n) <= 0) return null;
      const bf = 86.010 * Math.log10(w - n) - 70.041 * Math.log10(h) + 36.76;
      return Math.max(3, Math.min(55, Math.round(bf * 10) / 10));
    }
  },
  katchBMR(weightKg, bfPct) {
    if (!weightKg) return 0;
    if (bfPct && bfPct > 0 && bfPct < 70) {
      const lbmKg = weightKg * (1 - bfPct / 100);
      return 370 + 21.6 * lbmKg;
    }
    return 10 * weightKg + 625;
  },
  defaultActivityMult(sex) {
    return sex === 'female' ? 1.55 : 1.5;
  },
  recommendGoal({ sex, experience, bfPct }) {
    const exp = (experience || 'beginner').toLowerCase();
    const isFem = sex === 'female';
    const bf = num(bfPct);
    if (bf > 0) {
      if (!isFem) {
        if (bf >= 22) return { goal: 'cut', phase: 'phase1', reason: 'Body fat is 22%+; a controlled deficit prioritizes fat loss first.' };
        if (bf <= 12) return { goal: 'bulk', phase: 'lean', reason: 'Body fat is lean (<=12%); ideal range for a controlled lean surplus.' };
      } else {
        if (bf >= 30) return { goal: 'cut', phase: 'phase1', reason: 'Body fat is 30%+; a controlled deficit prioritizes fat loss first.' };
        if (bf <= 20) return { goal: 'bulk', phase: 'lean', reason: 'Body fat is lean (<=20%); ideal range for a controlled lean surplus.' };
      }
    }
    if (exp === 'beginner') {
      return { goal: 'recomp', phase: 'phase1', reason: 'Beginner training stage supports simultaneous muscle gain and body recomposition.' };
    }
    return { goal: 'maintain', phase: 'phase1', reason: 'Intermediate baseline maintenance to establish true TDEE before pushing surplus/deficit.' };
  },
  computeAdaptiveTDEE(weighIns, foodLogsByDate, units) {
    if (!Array.isArray(weighIns) || weighIns.length < 2) return null;
    const sorted = [...weighIns].filter(w => w.date && num(w.weight) > 0).sort((a, b) => a.date.localeCompare(b.date));
    if (sorted.length < 2) return null;
    const first = sorted[0];
    const last = sorted[sorted.length - 1];
    const d1 = new Date(first.date + 'T00:00:00');
    const d2 = new Date(last.date + 'T00:00:00');
    const days = Math.max(1, Math.round((d2 - d1) / 86400000));
    const kcalPerKg = units === 'imperial' ? (7700 / 0.45359237) : 7700;
    const dwKg = this.toKg(last.weight, units) - this.toKg(first.weight, units);
    const weightKcalDelta = dwKg * kcalPerKg;

    let totalIntake = 0;
    let loggedDays = 0;
    if (foodLogsByDate) {
      Object.entries(foodLogsByDate).forEach(([dt, items]) => {
        if (dt >= first.date && dt <= last.date && Array.isArray(items) && items.length) {
          totalIntake += items.reduce((s, x) => s + num(x.calories), 0);
          loggedDays++;
        }
      });
    }
    if (!loggedDays) return null;
    const avgDailyIntake = totalIntake / loggedDays;
    const avgDailyWeightKcal = weightKcalDelta / days;
    const adaptiveTdee = Math.round(avgDailyIntake - avgDailyWeightKcal);
    const weeklyChangeDisplay = Math.round(this.fromKg((dwKg / days) * 7, units) * 100) / 100;
    return {
      adaptiveTdee: Math.max(1000, adaptiveTdee),
      avgDailyIntake: Math.round(avgDailyIntake),
      loggedDays,
      spanDays: days,
      weeklyChangeDisplay,
      unitLabel: units === 'imperial' ? 'lb/wk' : 'kg/wk'
    };
  },
  computeTargets(prof, weighIns, foodLogsByDate) {
    const p = prof || {};
    const units = p.units === 'imperial' ? 'imperial' : 'metric';
    const sex = p.sex === 'female' ? 'female' : 'male';
    const experience = p.experience || 'beginner';
    const latestW = (weighIns && weighIns.length) ? num(weighIns[0].weight) : num(p.start_weight);
    const calcBf = this.navyBF({
      sex,
      units,
      height: p.height,
      waist: (weighIns && weighIns[0] && num(weighIns[0].waist)) ? weighIns[0].waist : p.waist,
      neck: (weighIns && weighIns[0] && num(weighIns[0].neck)) ? weighIns[0].neck : p.neck,
      hip: (weighIns && weighIns[0] && num(weighIns[0].hip)) ? weighIns[0].hip : p.hip
    });
    const latestBf = calcBf !== null ? calcBf : ((weighIns && weighIns[0] && num(weighIns[0].bf_pct)) ? num(weighIns[0].bf_pct) : num(p.start_bf));
    const weightKg = this.toKg(latestW, units);
    const bmr = Math.round(this.katchBMR(weightKg, latestBf));
    const actMult = num(p.activity_mult) > 0 ? num(p.activity_mult) : this.defaultActivityMult(sex);
    const formulaTdee = Math.round(bmr * actMult);
    const adaptive = this.computeAdaptiveTDEE(weighIns, foodLogsByDate, units);
    const baseTdee = adaptive ? adaptive.adaptiveTdee : formulaTdee;

    const goal = p.goal || 'cut';
    const phase = p.phase || 'phase1';
    let goalAdj = 0;
    if (goal === 'cut') goalAdj = phase === 'aggressive' ? -600 : -400;
    else if (goal === 'bulk') goalAdj = phase === 'lean' ? 250 : 400;
    else if (goal === 'recomp') goalAdj = -150;

    const minFloor = sex === 'female' ? 1200 : 1500;
    const rawCal = baseTdee ? Math.max(minFloor, baseTdee + goalAdj) : 2000;
    const calories = num(p.custom_calories) > 0 ? Math.round(num(p.custom_calories)) : Math.round(rawCal);

    // Protein grams per kg of body weight (or LBM when available)
    const lbmKg = (weightKg > 0 && latestBf > 0 && latestBf < 70) ? weightKg * (1 - latestBf / 100) : weightKg;
    let proPerKg = goal === 'cut' ? 2.0 : (goal === 'bulk' ? 1.8 : 1.9);
    if (sex === 'female' && goal === 'cut') proPerKg = 1.9;
    const refMassKg = lbmKg > 0 ? lbmKg : weightKg;
    const protein = num(p.custom_protein) > 0 ? r1(num(p.custom_protein)) : Math.max(60, Math.round(refMassKg * proPerKg));

    const fatPct = goal === 'cut' ? 0.25 : (goal === 'bulk' ? 0.24 : 0.26);
    const fat = num(p.custom_fat) > 0 ? r1(num(p.custom_fat)) : Math.max(35, Math.round((calories * fatPct) / 9));

    const remKcal = Math.max(0, calories - protein * 4 - fat * 9);
    const carbs = num(p.custom_carbs) > 0 ? r1(num(p.custom_carbs)) : Math.round(remKcal / 4);

    return {
      units,
      sex,
      latestW,
      latestBf,
      bmr,
      actMult,
      formulaTdee,
      adaptive,
      baseTdee,
      calories,
      protein,
      carbs,
      fat,
      suggestion: this.recommendGoal({ sex, experience, bfPct: latestBf })
    };
  }
};

async function loadMacroData(clientId) {
  const cid = (S.u.role === 'admin' || S.u.role === 'coach') ? clientId : S.u.id;
  const [pRes, wRes, fRes] = await Promise.all([
    sb.from('client_macro_profiles').select('*').eq('client_id', cid).maybeSingle(),
    sb.from('client_weigh_ins').select('*').eq('client_id', cid).order('date', { ascending: false }).limit(500),
    sb.from('food_logs').select('date, calories').eq('client_id', cid).gte('date', new Date(Date.now() - 120 * 864e5).toISOString().slice(0, 10)).limit(5000)
  ]);
  const prof = checkErr(pRes);
  const weighIns = checkErr(wRes) || [];
  const fRows = checkErr(fRes) || [];
  const foodByDate = {};
  fRows.forEach(x => {
    if (!foodByDate[x.date]) foodByDate[x.date] = [];
    foodByDate[x.date].push(x);
  });
  return { prof: prof || { client_id: cid, units: 'metric', sex: 'male', experience: 'beginner', goal: 'cut', phase: 'phase1', activity_mult: 1.5 }, weighIns, foodByDate };
}

function readMacroForm(cid, existingProf) {
  const g = id => ($(id) ? $(id).value : '');
  const gn = id => { const v = g(id).trim(); return v === '' ? null : num(v); };
  const gc = (id, k) => $(id) ? gn(id) : (existingProf && existingProf[k] != null ? existingProf[k] : null);
  const units = g('mc_units') || 'metric';
  const sex = g('mc_sex') || 'male';
  const height = gn('mc_height');
  const waist = gn('mc_waist');
  const neck = gn('mc_neck');
  const hip = gn('mc_hip');
  const startWeight = gn('mc_weight');
  const autoBf = Calc.navyBF({ sex, units, height, waist, neck, hip });
  const manualBf = gn('mc_bf');
  return {
    client_id: cid,
    units,
    sex,
    experience: g('mc_exp') || 'beginner',
    goal: g('mc_goal') || 'cut',
    phase: g('mc_phase') || 'phase1',
    height,
    waist,
    neck,
    hip,
    start_weight: startWeight,
    start_bf: manualBf !== null ? manualBf : autoBf,
    activity_mult: gn('mc_act') || Calc.defaultActivityMult(sex),
    custom_calories: gc('mc_c_cal', 'custom_calories'),
    custom_protein: gc('mc_c_pro', 'custom_protein'),
    custom_carbs: gc('mc_c_carb', 'custom_carbs'),
    custom_fat: gc('mc_c_fat', 'custom_fat'),
    updated_at: new Date().toISOString()
  };
}

function refreshMacroPreview() {
  const cid = (S.u.role === 'admin' || S.u.role === 'coach') ? ($('mc_client') ? $('mc_client').value : S.cid) : S.u.id;
  const prof = readMacroForm(cid, S.macroProf);
  const wList = [...(S.weighIns || [])];
  if (num(prof.start_weight) > 0 && (!wList.length || wList[0].date !== today())) {
    wList.unshift({ date: today(), weight: prof.start_weight, waist: prof.waist, neck: prof.neck, hip: prof.hip, bf_pct: prof.start_bf });
  }
  const res = Calc.computeTargets(prof, wList, S.foodByDate);
  if ($('mc_bf') && res.latestBf > 0 && document.activeElement !== $('mc_bf')) {
    const autoBf = Calc.navyBF(prof);
    if (autoBf !== null) $('mc_bf').value = autoBf;
  }
  const out = $('mc_summary_box');
  if (out) out.innerHTML = renderMacroSummaryCards(res);
}

function applySuggestedGoal() {
  const cid = (S.u.role === 'admin' || S.u.role === 'coach') ? ($('mc_client') ? $('mc_client').value : S.cid) : S.u.id;
  const prof = readMacroForm(cid, S.macroProf);
  const bf = Calc.navyBF(prof) ?? num(prof.start_bf);
  const sug = Calc.recommendGoal({ sex: prof.sex, experience: prof.experience, bfPct: bf });
  if ($('mc_goal')) $('mc_goal').value = sug.goal;
  if ($('mc_phase')) $('mc_phase').value = sug.phase;

  toast('Applied recommended goal: ' + sug.goal);
}

async function saveMacroProfile(cid) {
  const btn = $('mc_save_btn'); if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }

    const payload = readMacroForm(cid, S.macroProf);
    const oldU = S.macroProf && S.macroProf.units;
    if (oldU && oldU !== payload.units && (S.weighIns || []).length) {
      const k = payload.units == 'imperial' ? 1 : -1, cw = v => v == null ? null : r1(num(v) * Math.pow(2.20462, k)), cl = v => v == null ? null : r1(num(v) * Math.pow(2.54, -k));
      checkErr(await sb.from('client_weigh_ins').upsert(S.weighIns.map(x => ({ id: x.id, client_id: x.client_id, date: x.date, weight: cw(x.weight), waist: cl(x.waist), neck: cl(x.neck), hip: cl(x.hip), bf_pct: x.bf_pct, notes: x.notes })), { onConflict: 'id' }));
    }

function weightTrendSvg(w, uW) {
  const pts = [...w].reverse().filter(x => num(x.weight) > 0).slice(-30);
  if (pts.length < 2) return '<p class="mu">Log at least two weigh-ins to see the trend.</p>';

  { id: 'reps', label: 'Reps / Count', ph: 'Reps (e.g. 12)' },
  { id: 'weight', label: 'Weight', ph: 'Weight (e.g. 40 kg)' },
  { id: 'duration', label: 'Duration', ph: 'Time (e.g. 45 sec)' },

  { id: 'rpe', label: 'RPE', ph: 'RPE (e.g. 8)' }
];

function serializeRichPayload(payload, setCols, setRows) {
  const extra = {};
  if (payload.pace) extra.pace = payload.pace;
  if (payload.rest) extra.rest = payload.rest;
  if (payload.rpe) extra.rpe = payload.rpe;
  if (Array.isArray(setRows) && setRows.length) {
    extra.setCols = setCols || ['reps', 'weight'];
    extra.setRows = setRows;
  }
  const baseNotes = String(payload.notes || '').trim();
  const marker = Object.keys(extra).length ? '\n[[GYM_META:' + JSON.stringify(extra) + ']]' : '';
  return {
    ...payload,
    notes: baseNotes + marker
  };
}

function parseRichItem(it) {
  const rawNotes = String(it.notes || '');
  const match = rawNotes.match(/\n?\[\[GYM_META:(.*?)\]\]$/s);
  let meta = {};
  let cleanNotes = rawNotes;
  if (match) {
    cleanNotes = rawNotes.replace(match[0], '').trim();
    try { meta = JSON.parse(match[1]) || {}; } catch (_) { meta = {}; }
  }
  let setRows = Array.isArray(meta.setRows) ? meta.setRows : [];
  if (!setRows.length && String(it.fields || '').split(',').includes('perset') && String(it.reps || '').trim()) {
    setRows = String(it.reps).trim().split('|').map((seg, idx) => {
      const parts = seg.split('@').map(s => s.trim());
      return { n: idx + 1, reps: parts[0] || '', weight: parts[1] || '' };
    }).filter(x => x.reps || x.weight || x.duration || x.distance || x.rpe);
  }
  return {
    cleanNotes,
    pace: meta.pace || '',
    rest: meta.rest || '',
    rpe: meta.rpe || '',
    setCols: Array.isArray(meta.setCols) && meta.setCols.length ? meta.setCols : ['reps', 'weight'],
    setRows
  };
}

function fillForm() {
  const it = sDay(S.sc, S.sd).find(x => x.id == S.ed); if (!it) { S.ed = ''; return; }
  const rich = parseRichItem(it);
  $('se').value = it.exercise;
  $('sn').value = rich.cleanNotes || '';
  const f = String(it.fields || '').split(',').filter(Boolean);

  if ($('s_f_perset')) $('s_f_perset').checked = rich.setRows.length > 0;
  S.setCols = rich.setCols;
  S.setRows = rich.setRows.length
    ? rich.setRows.map(s => ({ reps: s.reps || '', weight: s.weight || '', duration: s.duration || '', distance: s.distance || '', rpe: s.rpe || '' }))
    : [{ reps: '', weight: '', duration: '', distance: '', rpe: '' }, { reps: '', weight: '', duration: '', distance: '', rpe: '' }];
  renderSetColToggles();
  renderSetInputs();

  SESSION_TOGGLE_KEYS.forEach(k => {
    const chk = $('s_f_' + k);
    let v = '';
    if (k === 'pace') v = rich.pace;
    else if (k === 'rest') v = rich.rest;
    else if (k === 'rpe') v = rich.rpe;
    else v = val(it, k, it);

    const active = f.includes(k) || Boolean(v);
    if (chk) chk.checked = active && !(rich.setRows.length && (k === 'sets' || k === 'reps' || k === 'weight'));
    if (UN[k]) {
      const p = parseUV(k, v);
      if ($('s_t_' + k)) $('s_t_' + k).value = p.n;
      if ($('s_u_' + k)) $('s_u_' + k).value = p.u;
    } else if ($('s_t_' + k)) {

async function saveItem() {
  const n = $('se').value.trim(); if (!n) { alert('Type the exercise name'); return; }
  const usePerSet = $('s_f_perset') && $('s_f_perset').checked;
  const f = SESSION_TOGGLE_KEYS.filter(k => $('s_f_' + k) && $('s_f_' + k).checked);
  if (!usePerSet && !f.length) { alert('Tick at least one workout metric (Per-set, Reps/Count, Weight, Duration, Distance, Pace, Rest, or RPE).'); return; }

  const activeSetRows = usePerSet
    ? (S.setRows || []).filter(r => ['reps', 'weight', 'duration', 'distance', 'rpe'].some(col => String(r[col] || '').trim()))
    : [];
  if (usePerSet && !activeSetRows.length) { alert('Enter at least one value (reps, weight, duration, distance, or RPE) in Set 1.'); return; }

  const allFields = (usePerSet ? ['perset'] : []).concat(f);
  const rawPayload = { clientId: S.sc, date: S.sd, exercise: n, fields: allFields.join(','), notes: $('sn').value.trim() };

  SESSION_TOGGLE_KEYS.forEach(k => {
    const inp = $('s_t_' + k);
    const v = (f.includes(k) && inp) ? inp.value.trim() : '';
    if (k === 'pace' || k === 'rest' || k === 'rpe') {
      rawPayload[k] = v;
    } else {
      rawPayload[k] = (UN[k] && v) ? v + ' ' + $('s_u_' + k).value : v;
    }
  });

  if (usePerSet) {
    rawPayload.sets = String(activeSetRows.length);
    rawPayload.reps = activeSetRows.map(r => {
      const parts = [];
      if (String(r.reps || '').trim()) parts.push(String(r.reps).trim());
      if (String(r.weight || '').trim()) parts.push('@ ' + String(r.weight).trim());
      if (String(r.duration || '').trim()) parts.push('(' + String(r.duration).trim() + ')');
      if (String(r.distance || '').trim()) parts.push('[' + String(r.distance).trim() + ']');
      if (String(r.rpe || '').trim()) parts.push('RPE ' + String(r.rpe).trim());
      return parts.join(' ');
    }).join(' | ');
  }

  const hasAnyVal = usePerSet || SESSION_TOGGLE_KEYS.some(k => Boolean(rawPayload[k])) || Boolean(rawPayload.notes);
  if (!hasAnyVal) { alert('Enter at least one value for this exercise.'); return; }

  const payload = serializeRichPayload(rawPayload, S.setCols, usePerSet ? activeSetRows : null);

  const btn = $('ssave'); if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  try {
    if (S.ed) await api('delSession', { id: S.ed });
    await api('addSession', payload);
    S.openDays = S.openDays || {};
    S.openDays[S.sd] = true;
    S.ed = '';
    S.setRows = [
      { reps: '', weight: '', duration: '', distance: '', rpe: '' },
      { reps: '', weight: '', duration: '', distance: '', rpe: '' },
      { reps: '', weight: '', duration: '', distance: '', rpe: '' }
    ];
    await fetchClientSessions(S.sc);
    toast('Exercise logged');
    sProfile();
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = S.ed ? 'Save changes' : 'Add to session'; }
  }
}

    : `<button type="button" class="cb-o add ${i ? '' : 'on'}" role="option" onclick="exPickAt('${inp.id}', ${i})">+ Add “${esc(o.name)}” as new exercise<span>${esc(o.g)}</span></button>`).join('')
    + (m.length > 8 ? `<div class="cb-n">+${m.length - 8} more · keep typing to narrow</div>` : '')
    + (!opts.length ? '<div class="cb-n">No exercises in this group yet. Type a name to add one.</div>' : '');
}
function exFocus(inp) { exFilter(inp); setTimeout(() => { try { inp.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (_) {} }, 300); }
function raFocus(inp) { raFilter(); setTimeout(() => { try { inp.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (_) {} }, 300); }
function exRefresh(id) { const i = $(id); if (i && $(i.dataset.l) && !$(i.dataset.l).hidden) exFilter(i); }
async function exPickAt(id, i) {
  const inp = $(id), l = $(inp.dataset.l), o = (S.exOpts[l.id] || [])[i]; if (!o) return;
  if (o.t == 'new') {
    if (!o.name) return;
    try { await api('addExercise', { name: o.name, group: o.g }); } catch (e) { alert(e.message || 'Could not add exercise'); return; }
    if (!S.ex.some(x => x.name.toLowerCase() == o.name.toLowerCase())) { S.ex.push({ name: o.name, group: o.g, media: '' }); S.ex.sort((a, b) => a.name.localeCompare(b.name)); }
    toast('Added “' + o.name + '” to ' + o.g);
    inp.value = o.name;
  } else inp.value = o.e.name;
  l.hidden = true; inp.setAttribute('aria-expanded', 'false');
  inp.dispatchEvent(new Event('change', { bubbles: true }));
}
function exKey(e, inp) {
  const l = $(inp.dataset.l), o = [...l.querySelectorAll('[role=option]')];
  if (e.key == 'ArrowDown' || e.key == 'ArrowUp') { e.preventDefault(); if (l.hidden) return exFilter(inp); if (!o.length) return; S.exI[l.id] = (S.exI[l.id] + (e.key == 'ArrowDown' ? 1 : -1) + o.length) % o.length; o.forEach((b, i) => b.classList.toggle('on', i == S.exI[l.id])); o[S.exI[l.id]].scrollIntoView({ block: 'nearest' }); }
  else if (e.key == 'Enter') { if (!l.hidden && o.length) { e.preventDefault(); exPickAt(inp.id, S.exI[l.id] || 0); } }
  else if (e.key == 'Escape') { l.hidden = true; }
}
document.addEventListener('click', e => document.querySelectorAll('.cb-list:not([hidden])').forEach(l => { if (!e.composedPath().includes(l.parentNode)) l.hidden = true; }));
function nxPrefill() { const d = $('nx'); if (d) d.open = true; $('nx_n').value = ($('xs').value || '').trim(); $('nx_n').focus(); }
async function addCustomEx() {
  const n = $('nx_n').value.trim(); if (!n) { alert('Type the exercise name'); return; }
  if (S.ex.some(e => e.name.toLowerCase() == n.toLowerCase())) { alert('That exercise already exists. Search for it below.'); $('xs').value = n; renderEx(); return; }
  let g = $('nx_g').value; if (g == '__new') g = $('nx_gn').value.trim(); if (!g) { alert('Choose a group or type a new one'); return; }
  const url = $('nx_m').value.trim(); if (url && !okUrl(url)) { alert('The link must start with http:// or https://'); return; }
  const raw = composeMedia(url, 'auto');
  try { await api('setMedia', { name: n, group: g, media: raw }); } catch (e) { alert(e.message || 'Could not add exercise'); return; }
  S.ex.push({ name: n, group: g, media: raw }); S.ex.sort((a, b) => a.name.localeCompare(b.name));
  ['nx_n', 'nx_gn', 'nx_m'].forEach(i => { $(i).value = ''; }); $('xs').value = n; renderEx(); toast('Exercise added');
}

/* Exercise library: photos, GIFs and videos */
const TYPES = [['auto', 'Auto'], ['photo', 'Photo / GIF'], ['video', 'Video']];
function tExercises() {
  set('tb', `<details class="card" id="nx"><summary><h2>Add custom exercise</h2></summary><input id="nx_n" placeholder="Exercise name, e.g. Cable Lateral Raise"><div class="row gap"><select id="nx_g" onchange="$('nx_gn').style.display = this.value == '__new' ? '' : 'none'">${exGroups().map(g => `<option>${esc(g)}</option>`).join('')}<option value="__new">＋ New group…</option></select><input id="nx_gn" placeholder="New group name" style="display:none"></div><input id="nx_m" type="url" inputmode="url" placeholder="Photo / GIF / video link (optional)"><div class="gap"></div><button onclick="addCustomEx()">Add exercise</button></details><div class="card"><input id="xs" placeholder="Search exercises…" oninput="renderEx()"><div class="mu gap">Paste a link to a photo, GIF or video (YouTube, Google Drive, or a direct image/video file). Clients see it at the top of the exercise, on the same page. For Google Drive photos and GIFs, set “Show as” to Photo / GIF.</div></div><div id="xl" class="grid"></div>`);
  renderEx();
}
function renderEx() {
  const q = ($('xs') ? $('xs').value : '').toLowerCase().trim();
  const toks = q.split(/\s+/).filter(Boolean);
  S.xl = S.ex.filter(e => toks.every(t => (e.name + ' ' + e.group).toLowerCase().includes(t))).slice(0, 40);
  set('xl', (S.xl.map((e, i) => { const sm = splitMedia(e.media); return `<div class="card"><b>${esc(e.name)}</b> <span class="mu">${esc(e.group)}</span>
    <div class="row gap"><input id="xm${i}" type="url" inputmode="url" placeholder="https://…" value="${esc(sm.url)}"><select id="xt${i}" style="flex:0 0 auto" title="Show as">${TYPES.map(([v, l]) => `<option value="${v}" ${v == sm.type ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
    <div class="row gap"><button onclick="saveMedia(${i})">Save</button><button class="g" onclick="previewMedia(${i})">Preview</button></div><div id="xp${i}"></div></div>`; }).join('')
    + (S.xl.length == 40 ? '<p class="mu">Showing the first 40. Type in the search box to narrow down.</p>' : '')) || ('<p class="mu">No exercises match.</p>' + (q ? '<button onclick="nxPrefill()">+ Add this as a custom exercise</button>' : '')));
}
function previewMedia(i) {
  const e = S.xl[i], inp = $('xm' + i), box = $('xp' + i); if (!e || !inp || !box) return;
  const url = inp.value.trim();
  if (url && !okUrl(url)) { alert('The link must start with http:// or https://'); return; }
  const raw = composeMedia(url, $('xt' + i).value);
  box.innerHTML = raw ? `<div class="gap"></div>` + mediaBlock(raw, 'x' + i, e.name) : '<p class="mu">No link yet. Clients will see a YouTube search link instead.</p>';
}
async function saveMedia(i) {
  const e = S.xl[i], inp = $('xm' + i); if (!e || !inp) return;
  const url = inp.value.trim();
  if (url && !okUrl(url)) { alert('The link must start with http:// or https://'); return; }
  const raw = composeMedia(url, $('xt' + i).value);
  await api('setMedia', { name: e.name, group: e.group, media: raw });
  e.media = raw;
  const b = inp.closest('.card').querySelector('button'); if (b) { b.textContent = 'Saved'; setTimeout(() => b.textContent = 'Save', 1200); }
  previewMedia(i);
}

boot();
